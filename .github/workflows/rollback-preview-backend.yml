name: Rollback Preview Backend Stable Alias

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: "Existing Lambda version to roll stable alias back to, e.g. 3"
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  rollback-preview:
    name: Rollback Preview Lambda Stable Alias
    runs-on: ubuntu-latest
    environment: preview

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_LAMBDA_FUNCTION_NAME: ${{ vars.AWS_LAMBDA_FUNCTION_NAME }}
      PROD_ALIAS: ${{ vars.PROD_ALIAS }}
      PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
      TARGET_VERSION: ${{ inputs.target_version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_BACKEND_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: backend-preview-rollback

      - name: Show Current Stable Alias
        run: |
          aws lambda get-alias \
            --function-name "${AWS_LAMBDA_FUNCTION_NAME}" \
            --name "${PROD_ALIAS}" \
            --query '{Alias:Name,CurrentVersion:FunctionVersion,Description:Description}' \
            --output table

      - name: Verify Target Version Exists
        run: |
          aws lambda get-function \
            --function-name "${AWS_LAMBDA_FUNCTION_NAME}:${TARGET_VERSION}" \
            --query '{FunctionName:Configuration.FunctionName,Version:Configuration.Version,LastModified:Configuration.LastModified,Runtime:Configuration.Runtime}' \
            --output table

      - name: Move Stable Alias to Target Version
        run: |
          aws lambda update-alias \
            --function-name "${AWS_LAMBDA_FUNCTION_NAME}" \
            --name "${PROD_ALIAS}" \
            --function-version "${TARGET_VERSION}"

      - name: Confirm Stable Alias
        run: |
          aws lambda get-alias \
            --function-name "${AWS_LAMBDA_FUNCTION_NAME}" \
            --name "${PROD_ALIAS}" \
            --query '{Alias:Name,FunctionVersion:FunctionVersion,RevisionId:RevisionId}' \
            --output table

      - name: Smoke Test Public Preview API
        run: |
          response="$(curl -sS -f -X POST "$PUBLIC_API_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "threadId": "ci-preview-rollback-smoke-test-001",
              "messages": [
                {
                  "role": "user",
                  "content": "Say '\''Hello test'\'' and nothing else."
                }
              ]
            }')"

          echo "$response" | node -e '
            let data = "";
            process.stdin.on("data", chunk => data += chunk);
            process.stdin.on("end", () => {
              const parsed = JSON.parse(data);
              const content = parsed.assistant && parsed.assistant.content;

              if (!content || !content.includes("Hello test")) {
                console.error("Unexpected public smoke test response:", data);
                process.exit(1);
              }

              console.log("Rollback smoke test passed:", content);
            });
          '
