name: Deploy Preview Backend Lambda

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  LAMBDA_ZIP: lambda.zip

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

  deploy-preview:
    name: Deploy to Preview Lambda $LATEST
    needs: test
    runs-on: ubuntu-latest
    environment: preview

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_LAMBDA_FUNCTION_NAME: ${{ vars.AWS_LAMBDA_FUNCTION_NAME }}
      TEST_API_URL: ${{ vars.TEST_API_URL }}
      TEST_API_KEY: ${{ secrets.TEST_API_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Lambda Package
        run: |
          rm -rf package "${LAMBDA_ZIP}"
          mkdir package

          rsync -a ./ package/ \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "coverage" \
            --exclude "test" \
            --exclude "tests" \
            --exclude "*.test.js" \
            --exclude "*.spec.js" \
            --exclude "lambda.zip" \
            --exclude "node_modules"

          cd package
          npm ci --omit=dev
          zip -r "../${LAMBDA_ZIP}" .

      - name: Upload Lambda Artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-backend-lambda-zip
          path: ${{ env.LAMBDA_ZIP }}
          retention-days: 7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BACKEND_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: backend-preview-deploy

      - name: Deploy Lambda Code to Preview $LATEST
        run: |
          aws lambda update-function-code \
            --function-name "${AWS_LAMBDA_FUNCTION_NAME}" \
            --zip-file "fileb://${LAMBDA_ZIP}" \
            --no-publish

          aws lambda wait function-updated \
            --function-name "${AWS_LAMBDA_FUNCTION_NAME}"

          aws lambda get-function-configuration \
            --function-name "${AWS_LAMBDA_FUNCTION_NAME}" \
            --query '{FunctionName:FunctionName,Runtime:Runtime,LastModified:LastModified,Version:Version,LastUpdateStatus:LastUpdateStatus}' \
            --output table

      - name: Smoke Test Preview Test API
        run: |
          response="$(curl -sS -f -X POST "$TEST_API_URL" \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: $TEST_API_KEY" \
            -d '{
              "threadId": "ci-preview-smoke-test-001",
              "messages": [
                {
                  "role": "user",
                  "content": "Say '\''Hello test'\'' and nothing else."
                }
              ]
            }')"

          echo "$response" | node -e '
            let data = "";
            process.stdin.on("data", chunk => data += chunk);
            process.stdin.on("end", () => {
              const parsed = JSON.parse(data);
              const content = parsed.assistant && parsed.assistant.content;

              if (!content || !content.includes("Hello test")) {
                console.error("Unexpected smoke test response:", data);
                process.exit(1);
              }

              console.log("Smoke test passed:", content);
            });
          '
