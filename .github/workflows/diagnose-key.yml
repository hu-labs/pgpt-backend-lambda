name: Environment Secret Probe (call)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Check TEST_API_KEY
        env:
          TEST_API_KEY: ${{ secrets.TEST_API_KEY }}
        run: |
          if [[ -n "${TEST_API_KEY:-}" ]]; then
            echo "TEST_API_KEY is available."
          else
            echo "TEST_API_KEY is NOT available."
            exit 1
          fi
          