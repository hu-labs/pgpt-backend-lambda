name: Test

on:
  pull_request:
    branches: [main]

  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Run Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Checks Script
        run: npm run check
